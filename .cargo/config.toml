# Function starts aligned to 64 bytes (0.28.2 round 4). Without it the
# placement of unrelated code shifted the KQ-10M import by about 6 % (one new
# exception class in the binding moved 371 functions across cache lines;
# function sizes unchanged). Measured with the alignment: import 0.532-0.536 s
# for both code states, binary 2.5 % larger.
[build]
rustflags = ["-C", "llvm-args=-align-all-functions=6"]
