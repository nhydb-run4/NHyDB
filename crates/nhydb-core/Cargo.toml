[package]
name = "nhydb-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
description = "NHyDB native storage engine (pure Rust core)"

[lib]
name = "nhydb_core"

[features]
# RUN8 AP0 (A7 analysis): counts cache-lock acquisitions, contended
# acquisitions and wait time; not part of normal builds
lock_stats = []
# RUN8 AP0 (A7 experiment P4c, measurement only): a dense read state keeps
# the cached block of the previous record instead of locking per record
exp_block_state = []

[dependencies]
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
crc32fast.workspace = true
miniz_oxide.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
getrandom.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
