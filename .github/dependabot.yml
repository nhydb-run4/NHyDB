# Dependency update pull requests (R015): GitHub Actions used by the
# workflows and the Cargo dependencies of the workspace. Updates are only
# proposed as pull requests; the CI workflow tests them before merging.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
