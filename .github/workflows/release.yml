# Release pipeline (see RELEASING.md).
#
# * workflow_dispatch (manual run): builds and tests all wheels and the source
#   distribution – a dry run, nothing is published.
# * push of a version tag vX.Y.Z: builds and tests as above, then creates a
#   DRAFT GitHub release with all files. An existing release is never
#   modified; the job fails instead.
# * release published (manual publication of the draft on GitHub): uploads
#   exactly the files attached to the release to PyPI via trusted publishing.
#   Requires the repository variable PUBLISH_PYPI = "true" and the approval
#   of the protected environment "pypi".
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        name: Version from Cargo.toml, tag and CHANGELOG must match
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
              exit 1
            fi
            if ! grep -q "^## \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section [$version]"
              exit 1
            fi
          fi

  # Rust unit and integration tests of the workspace on the release
  # platforms (R015: a release never relies on the CI status alone).
  rust-tests:
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --workspace --release

  linux:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist -i python3.12 python3.13 python3.14 python3.15
          # crates/nhydb-core/src/zlib.rs links the system zlib on Unix
          before-script-linux: |
            if command -v dnf >/dev/null; then dnf install -y zlib-devel
            elif command -v yum >/dev/null; then yum install -y zlib-devel
            fi
      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v6
        id: py314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v6
        id: py315
        with:
          python-version: "3.15"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # explicit interpreters only: automatic discovery would also pick up
          # other Python versions preinstalled on the runner (e.g. pre-releases)
          args: --release --out dist -i ${{ steps.py312.outputs.python-path }} ${{ steps.py313.outputs.python-path }} ${{ steps.py314.outputs.python-path }} ${{ steps.py315.outputs.python-path }}
      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v6
        id: py314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v6
        id: py315
        with:
          python-version: "3.15"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          # explicit interpreters only: automatic discovery would also pick up
          # other Python versions preinstalled on the runner (e.g. pre-releases)
          args: --release --out dist -i ${{ steps.py312.outputs.python-path }} ${{ steps.py313.outputs.python-path }} ${{ steps.py314.outputs.python-path }} ${{ steps.py315.outputs.python-path }}
      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows-x64
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist

  # Merges all build artifacts and checks that exactly the expected files exist.
  verify:
    needs: [check-version, rust-tests, linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check file set
        run: python3 tools/check_dist.py dist --version "${{ needs.check-version.outputs.version }}"
      - name: Check package metadata
        run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: dist

  # Installs the built wheels like a user and runs the Python test suite on
  # every platform with every supported Python version (5 x 4 = 20 jobs).
  test:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: dist
      - name: Install wheel and run Python tests
        shell: bash
        run: |
          python -m pip install numpy pytest cryptography
          python -m pip install --no-index --find-links dist nhydb
          python -m pytest -q tests/python

  github-release:
    name: GitHub release (draft)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check-version, verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: dist
      - name: Create draft release (never modifies an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; it is not modified. Delete it manually or use a new version."
            exit 1
          fi
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "NHyDB $VERSION" --notes-file notes.md

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nhydb/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Download the files attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'nhydb-*.whl' --pattern 'nhydb-*.tar.gz'
      - name: Check file set against the tagged Cargo.toml
        run: python3 tools/check_dist.py dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
