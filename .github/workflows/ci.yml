# Tests on every push and pull request: Rust core and Python package
# (the Python tests run against the installed wheel, as a user would).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # supported CPython versions; the Rust checks run once per OS (3.14)
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (warnings are errors)
        if: matrix.python == '3.14'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        if: matrix.python == '3.14'
        run: cargo test --workspace --release
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install numpy pytest cryptography
          python -m pip install --no-index --find-links dist nhydb
      - name: File format golden test
        run: python -m pytest -q tests/python/test_stab_format_golden.py
      - name: Python tests
        run: python -m pytest -q tests/python
