# Short checks, started manually only (Actions -> CI -> Run workflow). The full
# Rust and Python test suites run locally before a release (RELEASING.md); CI
# only checks that the code builds without warnings and that the wheel works
# on Linux and Windows with every supported Python version (smoke tests).
# macOS wheels are built and smoke-tested by the release workflow.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  smoke:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --only-binary=:all: numpy || echo "no numpy wheel, NumPy smoke test is skipped"
          python -m pip install --no-index --find-links dist nhydb
      - name: Smoke tests and file format golden test
        run: python -m pytest -q tests/smoke tests/python/test_stab_format_golden.py
